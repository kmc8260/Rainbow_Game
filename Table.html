<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Table - Rainbow Hold'em</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/table_style.css" />
    <link rel="stylesheet" href="css/table_bet.css" />
  </head>
  <body class="table-body">
    <div class="table-page">
      <header class="table-header">
        <div class="table-logo">Rainbow</div>
        <div class="round-label">
          Round <span id="round-number">1</span> &nbsp;·&nbsp;
          <span id="street-label"></span>
        </div>
        <div class="table-stats">
          <button class="table-link" id="leave-table-btn">Back to Main</button>
          <button class="table-link" id="logout-btn">Logout</button>
          <div class="chip-badge"><img src="assets/메인_코인_갯수.png" alt="Chips" /><span id="my-chip-total">0</span></div>
        </div>
      </header>

      <div class="table-rail">
        <div class="felt-table" id="felt-table">
          <div class="table-center">
            <div class="dealer-label">DEALER</div>
            <div class="dealer-slots" id="dealer-slots"></div>
            <div class="pot-pill">
              <img src="assets/메인_코인_갯수.png" alt="" />
              <span>Pot</span>
              <span class="pot-amount" id="pot-amount">0</span>
            </div>
          </div>

          <div class="seat seat-left" id="my-seat">
            <div class="seat-info">
              <img class="seat-avatar" src="assets/프로필.png" alt="" />
              <div>
                <div class="seat-name" id="my-name"></div>
                <div class="seat-chips" id="my-seat-chips"></div>
              </div>
            </div>
            <div class="seat-cards" id="my-card-slots"></div>
            <div class="seat-tag" id="my-tag"></div>
          </div>

          <div class="seat seat-right" id="opponent-seat">
            <div class="seat-info">
              <img class="seat-avatar" src="assets/프로필.png" alt="" />
              <div>
                <div class="seat-name" id="opponent-name"></div>
                <div class="seat-chips" id="opponent-chips"></div>
              </div>
            </div>
            <div class="seat-cards" id="opponent-card-slots"></div>
            <div class="seat-tag" id="opponent-tag"></div>
          </div>

          <div class="extra-opponents" id="extra-opponents"></div>
        </div>
      </div>

      <div class="table-dock">
        <div class="action-panel" id="action-panel" hidden>
          <div class="turn-status">
            <div class="turn-title">Your turn</div>
            <div class="bet-min-label" id="bet-min-label"></div>
          </div>
          <button class="btn btn-danger" id="die-btn">Die</button>
          <div class="bet-amount-row">
            <button type="button" class="bet-step" id="bet-minus" aria-label="Decrease bet">−</button>
            <input type="number" id="bet-amount" min="50" step="10" value="50" aria-label="Bet amount" />
            <button type="button" class="bet-step" id="bet-plus" aria-label="Increase bet">+</button>
          </div>
          <button class="btn btn-primary" id="bet-btn">Bet</button>
          <button class="btn btn-gold" id="allin-btn">All in</button>
        </div>
        <p class="table-status-text" id="table-status-text"></p>
        <p class="error-msg" id="table-error"></p>
      </div>

      <div class="result-overlay" id="result-overlay" hidden>
        <div class="result-card">
          <img class="trophy-icon" id="result-trophy" src="assets/메인_트로피.png" alt="Trophy" />
          <div class="result-title" id="result-title">You Win!</div>
          <div class="result-badge" id="result-badge" hidden>Rainbow Hold'em</div>
          <div class="result-winnings">
            <img src="assets/메인_코인_갯수.png" alt="" />
            <span id="result-amount">0</span>
          </div>
          <span id="result-round" hidden>1</span>
          <div class="result-actions">
            <button class="btn btn-secondary" id="result-leave-btn">Back to Main</button>
            <button class="submit-btn" id="next-round-btn" hidden>Next Round</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/table.js"></script>
  </body>
</html>
