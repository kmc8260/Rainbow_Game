<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mine - Rainbow Holdem</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/main_style.css" />
    <link rel="stylesheet" href="css/lobby_style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-title">RAINBOW<span>HOLDEM</span></div>
        </div>

        <nav class="sidebar-nav">
          <a href="Main.html" class="nav-item">Game</a>
          <a href="skin.html" class="nav-item">Skin</a>
          <a href="mine.html" class="nav-item active">Mine</a>
        </nav>

        <div class="sidebar-footer">
          <button class="sidebar-logout" id="logout-btn">Logout</button>
        </div>
      </aside>

      <main class="content-area">
        <h1 class="lobby-title">Mine</h1>

        <!-- Account info -->
        <section class="lobby-panel">
          <h2 class="lobby-panel-title">Account Info</h2>

          <div class="field">
            <label>Email</label>
            <input type="text" id="account-email" disabled />
          </div>

          <div class="field">
            <label>Chips</label>
            <input type="text" id="account-chips" disabled />
          </div>
        </section>

        <!-- Change nickname -->
        <section class="lobby-panel">
          <h2 class="lobby-panel-title">Change Nickname</h2>

          <div class="field">
            <label for="nickname-input">New Nickname</label>
            <input
              type="text"
              id="nickname-input"
              placeholder="Enter a new nickname"
              maxlength="12"
            />
          </div>

          <button class="submit-btn" id="save-nickname-btn">Save</button>
          <p class="error-msg" id="nickname-msg"></p>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/mine.js"></script>
  </body>
</html>
