<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mine</title>
    <link rel="stylesheet" href="css/main_style.css" />
    <link rel="stylesheet" href="css/lobby_style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-title">RAINBOW<span>HOLDEM</span></div>
        </div>

        <nav class="sidebar-nav">
          <a href="main.html" class="nav-item">Game</a>
          <a href="skin.html" class="nav-item">Skin</a>
          <a href="mine.html" class="nav-item active">Mine</a>
        </nav>

        <div class="sidebar-footer">
          <button class="sidebar-logout" id="logout-btn">Logout</button>
        </div>
      </aside>

      <main class="content-area">
        <h1 class="lobby-title">마이페이지</h1>

        <!-- 계정 정보 -->
        <section class="lobby-panel">
          <h2 class="lobby-panel-title">계정 정보</h2>

          <div class="field">
            <label>이메일</label>
            <input type="text" id="account-email" disabled />
          </div>

          <div class="field">
            <label>보유 칩</label>
            <input type="text" id="account-chips" disabled />
          </div>
        </section>

        <!-- 닉네임 변경 -->
        <section class="lobby-panel">
          <h2 class="lobby-panel-title">닉네임 변경</h2>

          <div class="field">
            <label for="nickname-input">새 닉네임</label>
            <input
              type="text"
              id="nickname-input"
              placeholder="변경할 닉네임을 입력하세요"
              maxlength="12"
            />
          </div>

          <button class="submit-btn" id="save-nickname-btn">변경하기</button>
          <p class="error-msg" id="nickname-msg"></p>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/mine.js"></script>
  </body>
</html>
