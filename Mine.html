<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mine - Rainbow Hold'em</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/main_style.css" />
    <link rel="stylesheet" href="css/lobby_style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-title">Rainbow</div>
          <div class="logo-sub">HOLD'EM</div>
        </div>
        <div class="sidebar-bar"></div>

        <nav class="sidebar-nav">
          <a href="Main.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l9-3 5 15-9 3z"/><path d="M15 5h3l3 3-3 11"/></svg>
            Game
          </a>
          <a href="skin.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
            Skin
          </a>
          <a href="Mine.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg>
            Mine
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-account">
            <img src="assets/프로필.png" alt="" />
            <div class="sidebar-account-text">
              <div class="sidebar-name" data-profile-name>-</div>
              <div class="sidebar-chips"><span data-profile-chips>-</span> chips</div>
            </div>
          </div>
          <button class="sidebar-logout" id="logout-btn">Logout</button>
        </div>
      </aside>

      <main class="content-area">
        <div class="page-head">
          <h1 class="page-title">Mine</h1>
          <div class="chip-badge"><img src="assets/메인_코인_갯수.png" alt="Chips" /><span data-profile-chips>-</span></div>
        </div>

        <div class="mine-columns">
          <section class="panel mine-profile">
            <img class="mine-avatar" src="assets/프로필.png" alt="Profile" />
            <div class="mine-name" data-profile-name>-</div>
            <div class="mine-stats">
              <div class="mine-stat">
                <img src="assets/메인_트로피.png" alt="" />
                <strong data-profile-wins>0</strong>
                <span>Wins</span>
              </div>
              <div class="mine-stat">
                <img src="assets/메인_코인_갯수.png" alt="" />
                <strong data-profile-chips>-</strong>
                <span>Chips</span>
              </div>
            </div>
          </section>

          <div class="mine-settings">
            <section class="panel">
              <h2 class="panel-title">Account Info</h2>
              <div class="field">
                <label for="account-email">Email</label>
                <input type="text" id="account-email" disabled />
              </div>
              <input type="hidden" id="account-chips" />
            </section>

            <section class="panel">
              <h2 class="panel-title">Change Nickname</h2>
              <div class="field">
                <label for="nickname-input">New nickname</label>
                <input type="text" id="nickname-input" placeholder="Enter a new nickname" maxlength="12" />
              </div>
              <button class="submit-btn mine-save" id="save-nickname-btn">Save</button>
              <p class="error-msg" id="nickname-msg"></p>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/mine.js"></script>
  </body>
</html>
