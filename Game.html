<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Lobby - Rainbow Hold'em</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/main_style.css" />
    <link rel="stylesheet" href="css/lobby_style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-title">Rainbow</div>
          <div class="logo-sub">HOLD'EM</div>
        </div>
        <div class="sidebar-bar"></div>

        <nav class="sidebar-nav">
          <a href="Main.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l9-3 5 15-9 3z"/><path d="M15 5h3l3 3-3 11"/></svg>
            Game
          </a>
          <a href="skin.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
            Skin
          </a>
          <a href="Mine.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg>
            Mine
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-account">
            <img src="assets/프로필.png" alt="" />
            <div class="sidebar-account-text">
              <div class="sidebar-name" data-profile-name>-</div>
              <div class="sidebar-chips"><span data-profile-chips>-</span> chips</div>
            </div>
          </div>
          <button class="sidebar-logout" id="logout-btn">Logout</button>
        </div>
      </aside>

      <main class="content-area">
        <div class="page-head">
          <h1 class="page-title">Game Lobby</h1>
          <div class="chip-badge"><img src="assets/메인_코인_갯수.png" alt="Chips" /><span data-profile-chips>-</span></div>
        </div>

        <div class="lobby-columns">
          <section class="panel rooms-panel">
            <div class="panel-head">
              <h2 class="panel-title">Public Rooms</h2>
            </div>
            <div class="room-list" id="room-list">
              <p class="loading-text">Loading...</p>
            </div>
          </section>

          <div class="lobby-side">
            <section class="panel lobby-panel">
              <h2 class="panel-title">Create Room</h2>
              <div class="field">
                <label for="room-name">Room name</label>
                <input type="text" id="room-name" placeholder="Enter a room name" maxlength="20" />
              </div>
              <div class="visibility-toggle">
                <button type="button" class="toggle-btn active" data-visibility="public" id="btn-public">Public</button>
                <button type="button" class="toggle-btn" data-visibility="private" id="btn-private">Private</button>
              </div>
              <p class="visibility-desc" id="visibility-desc">
                Anyone can join this room directly from the room list.
              </p>
              <button class="submit-btn" id="create-room-btn">Create Room</button>
              <p class="error-msg" id="create-error"></p>
            </section>

            <section class="panel lobby-panel">
              <h2 class="panel-title">Join Private Room</h2>
              <div class="code-join-row">
                <div class="field">
                  <label for="room-code-input">Room code</label>
                  <input type="text" id="room-code-input" placeholder="6-digit code" maxlength="6" />
                </div>
                <button class="join-code-btn" id="join-code-btn">Join Room</button>
              </div>
              <p class="error-msg" id="join-error"></p>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
