<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main</title>
    <link rel="stylesheet" href="css/common.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- 좌측 사이드바 -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="logo-title">RAINBOW<span>HOLDEM</span></div>
        </div>

        <nav class="sidebar-nav">
          <a href="main.html" class="nav-item active">Game</a>
          <a href="skin.html" class="nav-item">Skin</a>
          <a href="mine.html" class="nav-item">Mine</a>
        </nav>

        <div class="sidebar-footer">
          <!-- id="logout-btn" 추가 -->
          <button id="logout-btn" class="sidebar-logout">Logout</button>
        </div>
      </aside>

      <!-- 메인 콘텐츠 -->
      <main class="content-area">
        <section class="profile-panel">
          <img
            class="profile-picture"
            id="profile-pic"
            src="assets/프로필.png"
            alt="프로필 사진"
          />
          <div class="profile-nickname" id="nickname-label">불러오는 중...</div>

          <div class="stats-row">
            <div class="stat-item">
              <img
                class="stat-value"
                src="assets/메인_트로피.png"
                alt="승리 트로피"
              />
              <span class="stat-value" id="win-count">0</span>
            </div>
          </div>
          <div class="chip-row">
            <img class="chip-icon" src="assets/메인_코인_갯수.png" alt="칩" />
            <span class="chip-total" id="chip-amount">-</span>
          </div>
        </section>
        <div class="menu-row">
          <a href="roulette.html" class="menu-card">
            <img class="menu-card-icon" src="assets/룰렛.png" alt="룰렛" />
            <span class="menu-card-title">Roulette</span>
          </a>
          <a href="game.html" class="menu-card">
            <img
              class="menu-card-icon"
              src="assets/메인_게임_아이콘.png"
              alt="게임"
            />
            <span class="menu-card-title">Game</span>
          </a>
        </div>
        <p class="loading-text" id="status-msg"></p>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
